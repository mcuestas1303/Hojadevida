<script type="module">
// Prueba técnica (0 créditos): Tin y Tan pelean contra el rival dentro de un mundo 3D.
// Personajes 2D (dibujo de tinta en un lienzo, cabezas oficiales exportadas de palitos.py) puestos de pie en la escena.
// Requisitos de PARAMETROS.md 2.0, sección 7: A1 pelea, A2 aceleración y desaceleración, A3 mundo con profundidad,
// A4 fuego y humo, A5 choques, A6 explosión e implosión, A7 sonido (los eventos salen en window.EVENTOS), A8 daños.
import * as THREE from './node_modules/three/build/three.module.js';

const W = 1080, H = 1920, FPS = 30;
const Q = new URLSearchParams(location.search);
const PALETA = Q.get('paleta') || 'a_papel_con_fondo_frio', ENTORNO = Q.get('entorno') || 'ciudad_de_carton';
const PAL = await (await fetch(`paletas/${PALETA}.json`)).json();
// C: los colores del video salen de la paleta elegida para su tema; los de Tin y Tan vienen ya pintados en sus cabezas
const C = PAL.colores;

// ---------------------------------------------------------------- utilidades
let semilla = 20261126;
function azar() { semilla = (semilla * 1664525 + 1013904223) >>> 0; return semilla / 4294967296; }
const ra = (a, b) => a + (b - a) * azar();
const clamp = (u, a = 0, b = 1) => Math.max(a, Math.min(b, u));
const EASE = {
  lin: u => u, in: u => u * u * u, out: u => 1 - Math.pow(1 - u, 3), io: u => u * u * (3 - 2 * u),
  back: u => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
};
function mezcla(a, b, p) {
  if (typeof a === 'number') return a + (b - a) * p;
  if (Array.isArray(a)) return a.map((v, i) => mezcla(v, b[i], p));
  if (typeof a === 'object') { const o = {}; for (const k in a) o[k] = mezcla(a[k], b[k] === undefined ? a[k] : b[k], p); return o; }
  return p < 0.5 ? a : b;
}
// pista: [[S, valor, curva], ...]; devuelve el valor en S
function pista(claves, S) {
  if (S <= claves[0][0]) return claves[0][1];
  for (let i = 1; i < claves.length; i++) {
    if (S <= claves[i][0]) {
      const [s0, v0] = claves[i - 1], [s1, v1, e] = claves[i];
      return mezcla(v0, v1, EASE[e || 'io'](clamp((S - s0) / (s1 - s0))));
    }
  }
  return claves[claves.length - 1][1];
}
function escalon(claves, S) { let v = claves[0][1]; for (const c of claves) if (S >= c[0]) v = c[1]; return v; }

// ---------------------------------------------------------------- poses (grados desde la vertical hacia abajo; + = hacia donde mira)
const P = {
  quieto:   { t: 0,   aF: [10, 5],     aB: [-10, -5],    lF: [8, 4],     lB: [-8, -4],    c: 0 },
  guardia:  { t: 12,  aF: [55, 150],   aB: [25, 140],    lF: [28, 6],    lB: [-26, -8],   c: 0 },
  carga:    { t: -14, aF: [-55, 55],   aB: [60, 150],    lF: [18, 0],    lB: [-34, -12],  c: -6 },
  golpe:    { t: 30,  aF: [90, 90],    aB: [-25, 80],    lF: [44, 0],    lB: [-44, -24],  c: 6 },
  embiste:  { t: 42,  aF: [-40, -80],  aB: [-60, -100],  lF: [62, -10],  lB: [-55, -70],  c: 10 },
  patada:   { t: -22, aF: [-60, -110], aB: [50, 140],    lF: [95, 92],   lB: [-25, -70],  c: 0 },
  recogido: { t: 22,  aF: [100, 150],  aB: [-80, -120],  lF: [72, -30],  lB: [40, -60],   c: 0 },
  recibe:   { t: -32, aF: [-100, -140], aB: [-60, -20],  lF: [18, 40],   lB: [-30, -8],   c: -18 },
  vuela:    { t: -72, aF: [-140, -160], aB: [-120, -150], lF: [60, 80],  lB: [40, 70],    c: -20 },
  caido:    { t: -88, aF: [-150, -175], aB: [-70, -95],  lF: [80, 96],   lB: [86, 62],    c: 0 },
  agachado: { t: 30,  aF: [40, 90],    aB: [-20, 40],    lF: [70, -40],  lB: [-50, -100], c: 0 },
  poder:    { t: -8,  aF: [150, 175],  aB: [-150, -175], lF: [30, 4],    lB: [-30, -4],   c: -12 },
  pisoton:  { t: 36,  aF: [60, 30],    aB: [-40, -10],   lF: [50, -20],  lB: [-45, -60],  c: 12 },
  festeja:  { t: 0,   aF: [140, 165],  aB: [-140, -165], lF: [14, 4],    lB: [-14, -4],   c: -8 },
  corre1:   { t: 30,  aF: [70, 120],   aB: [-60, -10],   lF: [55, 10],   lB: [-40, -95],  c: 4 },
  corre2:   { t: 30,  aF: [-60, -10],  aB: [70, 120],    lF: [-40, -95], lB: [55, 10],    c: 4 },
  resbala:  { t: -26, aF: [30, 100],   aB: [60, 120],    lF: [36, 10],   lB: [-10, 10],   c: -8 },
};

// ---------------------------------------------------------------- personajes 2D
const U = 56, LIENZO = 1024, CAD = [512, 600], MUNDO_R = 0.36;      // px por R, lienzo, cadera en el lienzo, R en el mundo
const PROP = {
  tin:  { cabeza: 1.0, cuello: 0.18, torso: 1.45, brazo: 0.78, ante: 0.72, muslo: 0.85, pierna: 0.80, g: 0.15, mano: 0.12, pie: [0.22, 0.10], sprite: 256, sube: 0.9 },
  tan:  { cabeza: 1.0, cuello: 0.18, torso: 1.45, brazo: 0.78, ante: 0.72, muslo: 0.85, pierna: 0.80, g: 0.15, mano: 0.12, pie: [0.22, 0.10], sprite: 256, sube: 0.9 },
  duda: { cabeza: 1.35, cuello: 0.15, torso: 1.9, brazo: 0.95, ante: 0.9, muslo: 1.05, pierna: 1.0, g: 0.19, mano: 0.21, pie: [0.34, 0.15], sprite: 322, sube: 0.82 },
};
const IMG = {};
async function cargar(nombre) {
  const im = new Image(); im.src = `sprites/${PALETA}/${nombre}.png`; await im.decode(); IMG[nombre] = im;
}
function esqueleto(pr, pose, mira) {
  const pt = (o, ang, l) => { const a = ang * Math.PI / 180; return [o[0] + mira * Math.sin(a) * l, o[1] + Math.cos(a) * l]; };
  const cadera = [0, 0];
  const cuello = pt(cadera, 180 - pose.t, pr.torso), hombro = pt(cadera, 180 - pose.t, pr.torso - 0.22);
  const cabeza = pt(cuello, 180 - pose.t, pr.cuello + pr.cabeza * pr.sube);
  const lado = k => { const a = pt(k[0] === 'a' ? hombro : cadera, pose[k][0], k[0] === 'a' ? pr.brazo : pr.muslo); return [a, pt(a, pose[k][1], k[0] === 'a' ? pr.ante : pr.pierna)]; };
  const e = { cadera, cuello, hombro, cabeza, aF: lado('aF'), aB: lado('aB'), lF: lado('lF'), lB: lado('lB') };
  e.bajo = Math.max(e.lF[1][1] + pr.pie[1], e.lB[1][1] + pr.pie[1], e.aF[1][1] + pr.mano, e.aB[1][1] + pr.mano, cabeza[1] + pr.cabeza * 0.75);
  return e;
}
class Personaje {
  constructor(id) {
    this.id = id; this.pr = PROP[id];
    this.cv = document.createElement('canvas'); this.cv.width = this.cv.height = LIENZO;
    this.cx = this.cv.getContext('2d');
    this.tex = new THREE.CanvasTexture(this.cv); this.tex.colorSpace = THREE.SRGBColorSpace; this.tex.anisotropy = 4;
    const mat = new THREE.MeshBasicMaterial({ map: this.tex, transparent: true, alphaTest: 0.3, side: THREE.DoubleSide });
    this.malla = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    this.malla.castShadow = true;
    this.malla.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: this.tex, alphaTest: 0.3 });
    this.previa = null;
  }
  dibujar(pose, mira, cabeza, borron, opaco = 1) {
    const g = this.cx, pr = this.pr, e = esqueleto(pr, pose, mira);
    g.clearRect(0, 0, LIENZO, LIENZO);
    const px = p => [CAD[0] + p[0] * U, CAD[1] + p[1] * U];
    const traza = (pts, alfa) => {
      g.globalAlpha = alfa; g.strokeStyle = C.linea; g.fillStyle = C.linea; g.lineWidth = pr.g * U; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); pts.forEach((p, i) => { const q = px(p); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }); g.stroke();
    };
    const parte = (es, alfa) => {
      for (const k of ['lB', 'aB']) this.miembro(es, k, alfa, px, traza, mira);
      traza([es.cadera, es.cuello], alfa);
    };
    if (borron && this.previa) { parte(this.previa, 0.22); for (const k of ['lF', 'aF']) this.miembro(this.previa, k, 0.22, px, traza, mira); }
    parte(e, opaco);
    // cabeza (sprite oficial), gira con el torso
    const im = IMG[cabeza], q = px(e.cabeza), s = pr.sprite;
    g.save(); g.globalAlpha = opaco; g.translate(q[0], q[1]); g.scale(mira, 1); g.rotate((pose.t * 0.6 + (pose.c || 0)) * Math.PI / 180);
    g.drawImage(im, -s / 2, -s / 2, s, s); g.restore();
    for (const k of ['lF', 'aF']) this.miembro(e, k, opaco, px, traza, mira);
    g.globalAlpha = 1;
    this.tex.needsUpdate = true; this.previa = e;
    return e;
  }
  miembro(e, k, alfa, px, traza, mira) {
    const g = this.cx, pr = this.pr, base = k[0] === 'a' ? e.hombro : e.cadera;
    traza([base, e[k][0], e[k][1]], alfa);
    const q = px(e[k][1]);
    g.beginPath();
    if (k[0] === 'a') g.arc(q[0], q[1], pr.mano * U, 0, 7);
    else g.ellipse(q[0] + mira * pr.pie[0] * 0.6 * U, q[1], pr.pie[0] * U, pr.pie[1] * U, 0, 0, 7);
    g.fill();
  }
  colocar(e, x, y, z, escala) {
    const lado = LIENZO / U * MUNDO_R * escala;
    const caderaY = e.bajo * MUNDO_R * escala + y;
    this.malla.scale.set(lado, lado, 1);
    this.malla.position.set(x, caderaY + (CAD[1] - LIENZO / 2) / LIENZO * lado, z);
    this.cabezaMundo = new THREE.Vector3(x + e.cabeza[0] * MUNDO_R * escala, caderaY - e.cabeza[1] * MUNDO_R * escala, z);
    this.manoMundo = new THREE.Vector3(x + e.aF[1][0] * MUNDO_R * escala, caderaY - e.aF[1][1] * MUNDO_R * escala, z);
    this.pieMundo = new THREE.Vector3(x + e.lF[1][0] * MUNDO_R * escala, caderaY - e.lF[1][1] * MUNDO_R * escala, z);
  }
}

// ---------------------------------------------------------------- escena
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(C.fondo);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const escena = new THREE.Scene();
escena.fog = new THREE.Fog(C.fondo, 16, 42);
const camara = new THREE.PerspectiveCamera(36, W / H, 0.1, 100);
escena.add(new THREE.HemisphereLight(0xffffff, 0xe6d8b8, 1.9));
const sol = new THREE.DirectionalLight(0xfff4dd, 1.5);
sol.position.set(-7, 13, 9); sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 40 }); sol.shadow.bias = -0.0015;
escena.add(sol);

function lienzo(w, h, pinta) { const c = document.createElement('canvas'); c.width = w; c.height = h; pinta(c.getContext('2d'), w, h); return c; }
// suelo: papel con cuadrícula de tinta (da la perspectiva)
const texSuelo = new THREE.CanvasTexture(lienzo(1024, 1024, (g, w, h) => {
  g.fillStyle = C.suelo; g.fillRect(0, 0, w, h); g.strokeStyle = C.cuadricula; g.lineWidth = 3;
  for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * w / 8, 0); g.lineTo(i * w / 8, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h / 8); g.lineTo(w, i * h / 8); g.stroke(); }
}));
texSuelo.wrapS = texSuelo.wrapT = THREE.RepeatWrapping; texSuelo.repeat.set(8, 8); texSuelo.colorSpace = THREE.SRGBColorSpace; texSuelo.anisotropy = 8;
const suelo = new THREE.Mesh(new THREE.PlaneGeometry(64, 64), new THREE.MeshLambertMaterial({ map: texSuelo }));
suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; escena.add(suelo);
// daños que se quedan: calcomanías sobre el suelo (mundo de -8 a 8 en x y z)
const cvDano = lienzo(2048, 2048, () => {}), gDano = cvDano.getContext('2d');
const texDano = new THREE.CanvasTexture(cvDano); texDano.colorSpace = THREE.SRGBColorSpace;
const dano = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), new THREE.MeshBasicMaterial({ map: texDano, transparent: true, depthWrite: false }));
dano.rotation.x = -Math.PI / 2; dano.position.y = 0.012; escena.add(dano);
const aDano = (x, z) => [(x + 8) / 16 * 2048, (z + 8) / 16 * 2048];
function grieta(x, z, tam, ramas = 9) {
  const [cx, cy] = aDano(x, z); gDano.strokeStyle = C.linea; gDano.lineCap = 'round';
  for (let i = 0; i < ramas; i++) {
    let a = i / ramas * 6.283 + ra(-0.3, 0.3), px = cx, py = cy, l = tam * 128 * ra(0.5, 1.1);
    gDano.lineWidth = ra(5, 10); gDano.beginPath(); gDano.moveTo(px, py);
    for (let k = 0; k < 5; k++) { a += ra(-0.5, 0.5); px += Math.cos(a) * l / 5; py += Math.sin(a) * l / 5; gDano.lineTo(px, py); }
    gDano.stroke();
  }
  texDano.needsUpdate = true;
}
function quemadura(x, z, r) {
  const [cx, cy] = aDano(x, z), R = r * 128, gr = gDano.createRadialGradient(cx, cy, R * 0.1, cx, cy, R);
  gr.addColorStop(0, 'rgba(43,36,32,0.85)'); gr.addColorStop(0.6, 'rgba(43,36,32,0.45)'); gr.addColorStop(1, 'rgba(43,36,32,0)');
  gDano.fillStyle = gr; gDano.beginPath(); gDano.arc(cx, cy, R, 0, 7); gDano.fill(); texDano.needsUpdate = true;
}
function garabatoResto(x, z) {
  const [cx, cy] = aDano(x, z); gDano.strokeStyle = C.linea; gDano.lineWidth = 9; gDano.lineCap = 'round'; gDano.beginPath();
  for (let i = 0; i < 60; i++) { const t = i / 59 * 9; const px = cx + Math.sin(t * 1.7) * 60 + Math.sin(t * 3.1) * 25, py = cy + Math.cos(t * 1.3) * 34; i ? gDano.lineTo(px, py) : gDano.moveTo(px, py); }
  gDano.stroke(); texDano.needsUpdate = true;
}
// cajas con contorno de tinta (casco invertido), para que el mundo 3D se lea como dibujo
const matTinta = new THREE.MeshBasicMaterial({ color: C.linea, side: THREE.BackSide });
function caja(w, h, d, color, borde = 0.05) {
  const grupo = new THREE.Group(), geo = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color })); m.castShadow = true; m.receiveShadow = true; grupo.add(m);
  const c = new THREE.Mesh(geo, matTinta); c.scale.set(1 + borde / w, 1 + borde / h, 1 + borde / d); grupo.add(c);
  return grupo;
}
// el entorno (fondo en profundidad y utilería que se rompe) sale de la biblioteca: uno por tema de video
const { construir } = await import(`./entornos/${ENTORNO}.js`);
const { cajones, pilar } = construir({ THREE, escena, caja, C });
const trozos = [];
function romperCajones(dir) {
  for (const c of cajones) {
    escena.remove(c);
    for (let i = 0; i < 8; i++) {
      const t = caja(0.45, 0.45, 0.45, C.utileria, 0.04);
      t.position.set(c.position.x + ((i & 1) - 0.5) * 0.45, c.position.y + (((i >> 1) & 1) - 0.5) * 0.45, c.position.z + (((i >> 2) & 1) - 0.5) * 0.45);
      t.userData = { v: new THREE.Vector3(dir * ra(1.5, 6), ra(2.5, 8), ra(-3, 2.2)), w: new THREE.Vector3(ra(-9, 9), ra(-9, 9), ra(-9, 9)), quieto: false };
      escena.add(t); trozos.push(t);
    }
  }
}
function empujarTrozos(x, z, fuerza) {
  for (const t of trozos) { const d = t.position.clone().sub(new THREE.Vector3(x, 0, z)); const l = Math.max(0.6, d.length()); if (l < 5) { t.userData.v.add(d.normalize().multiplyScalar(fuerza / l)).setY(ra(3, 6)); t.userData.quieto = false; } }
}

// ---------------------------------------------------------------- partículas: fuego, humo, polvo, chispas
const texSuave = new THREE.CanvasTexture(lienzo(128, 128, (g) => { const gr = g.createRadialGradient(64, 64, 4, 64, 64, 62); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.55, 'rgba(255,255,255,0.75)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }));
const texEstrella = new THREE.CanvasTexture(lienzo(256, 256, (g) => {
  g.translate(128, 128); g.beginPath(); for (let i = 0; i < 16; i++) { const r = i % 2 ? 56 : 118, a = i * Math.PI / 8; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath();
  g.fillStyle = C.estrella; g.fill(); g.lineWidth = 9; g.strokeStyle = '#2B2420'; g.lineJoin = 'round'; g.stroke();
})); texEstrella.colorSpace = THREE.SRGBColorSpace;
const particulas = [];
const TIPOS = {
  humo:   { col: [C.humo, C.humo], op: [0.42, 0], tam: [0.45, 1.9], vida: [0.7, 1.3], g: 1.6, freno: 1.2 },
  polvo:  { col: [C.polvo, C.polvo], op: [0.9, 0], tam: [0.35, 1.5], vida: [0.5, 1.0], g: 0.5, freno: 2.5 },
  fuego:  { col: [C.fuego_nucleo, C.fuego_borde], op: [0.95, 0], tam: [0.7, 0.15], vida: [0.3, 0.65], g: 3.2, freno: 1.0 },
  chispa: { col: [C.fuego_nucleo, C.fuego_borde], op: [1, 0], tam: [0.16, 0.05], vida: [0.25, 0.6], g: -9, freno: 0.4 },
  tinta:  { col: [C.linea, C.linea], op: [1, 0.9], tam: [0.14, 0.05], vida: [0.5, 0.9], g: -12, freno: 0.2 },
};
function soltar(tipo, pos, vel, dispersion = 1, n = 1, hacia = null) {
  const T = TIPOS[tipo];
  for (let i = 0; i < n; i++) {
    const m = new THREE.SpriteMaterial({ map: texSuave, color: T.col[0], transparent: true, depthWrite: false });
    const s = new THREE.Sprite(m);
    s.position.copy(pos).add(new THREE.Vector3(ra(-1, 1), ra(-1, 1), ra(-1, 1)).multiplyScalar(0.15 * dispersion));
    escena.add(s);
    particulas.push({ s, T, v: new THREE.Vector3(vel.x + ra(-1, 1) * dispersion, vel.y + ra(-1, 1) * dispersion, vel.z + ra(-1, 1) * dispersion), edad: 0, vida: ra(T.vida[0], T.vida[1]), k: ra(0.8, 1.25), hacia });
  }
}
const c0 = new THREE.Color(), c1 = new THREE.Color();
function pasoParticulas(dS) {
  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i]; p.edad += dS; const u = p.edad / p.vida;
    if (u >= 1) { escena.remove(p.s); p.s.material.dispose(); particulas.splice(i, 1); continue; }
    if (p.hacia) { p.s.position.lerp(p.hacia, clamp(dS * 7 * (0.4 + u * 2))); }
    else { p.v.y += p.T.g * dS; p.v.multiplyScalar(Math.max(0, 1 - p.T.freno * dS)); p.s.position.addScaledVector(p.v, dS); if (p.s.position.y < 0.05) { p.s.position.y = 0.05; p.v.y *= -0.3; } }
    const t = (p.T.tam[0] + (p.T.tam[1] - p.T.tam[0]) * u) * p.k; p.s.scale.set(t, t, 1);
    p.s.material.opacity = p.T.op[0] + (p.T.op[1] - p.T.op[0]) * u * u;
    p.s.material.color.copy(c0.set(p.T.col[0])).lerp(c1.set(p.T.col[1]), u);
  }
}
// ondas de choque en el suelo (hacia afuera) e implosión (hacia adentro)
const ondas = [];
function onda(x, z, r0, r1, vida, y = 0.03) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.88, 1, 64), new THREE.MeshBasicMaterial({ color: C.linea, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); escena.add(m); ondas.push({ m, r0, r1, vida, edad: 0 });
}
function pasoOndas(dS) {
  for (let i = ondas.length - 1; i >= 0; i--) {
